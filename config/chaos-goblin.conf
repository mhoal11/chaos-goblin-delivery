# Chaos Goblin Delivery: general settings
# Installed to ~/.config/chaos-goblin/chaos-goblin.conf

# Recipient that `scan` and `ocr` offer to send to.
# Must match a file in recipients/ (desktop -> recipients/desktop.conf).
DEFAULT_RECIPIENT="desktop"

# Where `scan` saves finished PDFs.
SCAN_DIR="$HOME/Documents/Scans"

# SANE device name. Leave blank to auto-detect an Epson scanner over USB.
# List devices with: scanimage -L
SCANNER=""
