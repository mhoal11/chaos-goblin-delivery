# Chaos Goblin Delivery: recipient profile
#
# Copy to ~/.config/chaos-goblin/recipients/<name>.conf
# then send with:  send-to <name> file.pdf

# Name shown in prompts and notifications.
DISPLAY_NAME="My Windows PC"

# Windows PC's IP address (or hostname) on your local network.
SMB_HOST="192.168.x.x"

# Name of the shared folder on that PC.
SMB_SHARE="ShareName"

# smbclient credentials file (see smbcredentials.example).
# Keep it private: chmod 600.
CREDENTIALS="$HOME/.smbcredentials"
